<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7EEE2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex, nofollow">
<title>Marco familiar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <main id="screen" aria-live="polite"></main>
  <nav id="rail" aria-label="Pantallas">
    <button data-go="hoy" class="nav"><span class="ic">📅</span><span>Hoy</span></button>
    <button data-go="calendario" class="nav"><span class="ic">🗓️</span><span>Calendario</span></button>
    <button data-go="luz" class="nav"><span class="ic">⚡</span><span>Luz</span></button>
    <button data-go="ninos" class="nav"><span class="ic">⭐</span><span>Niños</span></button>
    <button data-go="compra" class="nav"><span class="ic">🛒</span><span>Compra</span></button>
    <button data-act="refresh" class="nav sec"><span class="ic">🔄</span><span>Actualizar</span></button>
    <button data-go="ajustes" class="nav sec"><span class="ic">⚙️</span><span>Ajustes</span></button>
    <button data-act="sleep" class="nav sec"><span class="ic">🌙</span><span>Dormir</span></button>
    <div class="rail-clock" data-clock="rail"></div>
  </nav>
</div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
<div id="night" class="night hidden"><div class="night-time" data-clock="night"></div><div class="night-date" data-clock="nightdate"></div><div class="night-hint">Toca para despertar</div></div>
<div id="toast" class="toast hidden"></div>
<script src="vendor/ical.min.js"></script>
<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/custody.js"></script>
<script src="js/calendar.js"></script>
<script src="js/weather.js"></script>
<script src="js/luz.js"></script>
<script src="js/app.js"></script>
</body>
</html>
